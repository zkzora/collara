# Remote-console view of the Tier B nodes (Admin APIs only). Used by `infra/tierb/ctl.sh console <script>` to read
# the decentralized party's topology and to disconnect / reconnect participants from the synchronizer.
canton {
  features.enable-preview-commands = yes
  remote-participants {
    p1 { admin-api { address = "127.0.0.1", port = 5002 }, ledger-api { address = "127.0.0.1", port = 5001 } }
    p2 { admin-api { address = "127.0.0.1", port = 5012 }, ledger-api { address = "127.0.0.1", port = 5011 } }
    p3 { admin-api { address = "127.0.0.1", port = 5022 }, ledger-api { address = "127.0.0.1", port = 5021 } }
  }
  remote-sequencers.sequencer1 {
    public-api { address = "127.0.0.1", port = 5031 }
    admin-api { address = "127.0.0.1", port = 5032 }
  }
  remote-mediators.mediator1 {
    admin-api { address = "127.0.0.1", port = 5042 }
  }
}
