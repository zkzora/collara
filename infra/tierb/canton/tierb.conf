# Collara Tier B: Canton open-source 3.5.19 inside WSL. One JVM runs one sequencer, one mediator and three
# participants (one per governance member). In-memory storage: `scripts/tierb/down.mjs` discards everything, and
# `up` always starts from a fresh synchronizer, so DM node state is wiped with it.
#
# DEV ONLY. `unsafe-jwt-hmac-256` accepts any HS256 token signed with the shared secret; the DM nodes run with
# `--insecure` and mint such tokens (sub = ledger-api-user, no exp). Never use this outside a developer laptop.
#
# Ports (synthesis §4.2): ledger 5001/5011/5021, admin 5002/5012/5022, JSON 7585/7586/7587. The sequencer
# (public 5031, admin 5032) and mediator (admin 5042) are not in the synthesis map; they sit in the same 50xx
# block, which nothing else in the port map uses.

_tierb_auth {
  auth-services = [{
    type = unsafe-jwt-hmac-256
    secret = "collara-tierb-dev-secret"
    secret = ${?TIERB_HMAC_SECRET}
    target-audience = "https://collara.local/tierb-ledger-api"
    target-audience = ${?TIERB_HMAC_AUDIENCE}
  }]
  # DM leaves Commands.user_id empty; the token subject must be a participant admin to allocate parties,
  # upload DARs and change topology through the Ledger API.
  user-management-service.additional-admin-user-id = "ledger-api-user"
  # DM v1.12.0 mints its insecure-mode Canton token without `exp` (crates/decman/src/auth/mock.rs). Canton 3.5.19
  # rejects such tokens ("Could not verify JWT token: token has no expiration time") unless the lifetime is
  # unbounded. Observed on this setup; DEV ONLY.
  max-token-lifetime = Inf
}

canton {
  parameters.ports-file = ${?TIERB_PORTS_FILE}
  # DM's /contracts workflow signs the decentralized party's interactive submissions with each participant's
  # Daml signing key, which it exports from the participant vault (Admin API VaultService). Canton 3.5.19 refuses
  # that export unless preview commands are enabled ("Remote export of private keys only allowed when preview is
  # enabled"). Observed on this setup; DEV ONLY.
  features.enable-preview-commands = yes

  sequencers.sequencer1 {
    storage.type = memory
    public-api { address = "127.0.0.1", port = 5031 }
    admin-api { address = "127.0.0.1", port = 5032 }
    sequencer {
      type = reference
      config.storage.type = memory
    }
  }

  mediators.mediator1 {
    storage.type = memory
    admin-api { address = "127.0.0.1", port = 5042 }
  }

  participants {
    p1 {
      storage.type = memory
      admin-api { address = "127.0.0.1", port = 5002 }
      ledger-api = ${_tierb_auth} { address = "127.0.0.1", port = 5001 }
      http-ledger-api { address = "127.0.0.1", port = 7585 }
    }
    p2 {
      storage.type = memory
      admin-api { address = "127.0.0.1", port = 5012 }
      ledger-api = ${_tierb_auth} { address = "127.0.0.1", port = 5011 }
      http-ledger-api { address = "127.0.0.1", port = 7586 }
    }
    p3 {
      storage.type = memory
      admin-api { address = "127.0.0.1", port = 5022 }
      ledger-api = ${_tierb_auth} { address = "127.0.0.1", port = 5021 }
      http-ledger-api { address = "127.0.0.1", port = 7587 }
    }
  }
}
