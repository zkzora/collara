# Collara local ledger: JWT auth for the `dpm sandbox` participant ("sandbox", JSON API 7575).
#
# DEV ONLY. `unsafe-jwt-hmac-256` accepts any HS256 token signed with a shared secret.
# Never use it outside a developer laptop; production uses `jwt-jwks` (e.g. Keycloak).
#
# Tokens must carry `aud` = target-audience and `sub` = ledger user id, and expire within
# 300 s (Canton's default max-token-lifetime). The audience is fixed because the participant
# id changes on every sandbox restart.
#
# Override with environment variables (HOCON `${?VAR}` keeps the default when unset):
#   CANTON_JWT_HMAC_SECRET   shared HS256 secret (the default below is a public placeholder)
#   CANTON_JWT_AUDIENCE      token audience
canton.participants.sandbox.ledger-api.auth-services = [{
  type = unsafe-jwt-hmac-256
  secret = "collara-local-dev-secret-change-me"
  secret = ${?CANTON_JWT_HMAC_SECRET}
  target-audience = "https://collara.local/ledger-api"
  target-audience = ${?CANTON_JWT_AUDIENCE}
}]
