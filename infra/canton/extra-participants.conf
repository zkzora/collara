# 3-participant mode: adds participant2 (JSON API 7576) and participant3 (JSON API 7577)
# to `dpm sandbox`. The sandbox bootstrap connects every local participant to synchronizer-1.
# Load it after sandbox-auth.conf:
#   dpm sandbox -c infra/canton/sandbox-auth.conf -c infra/canton/extra-participants.conf ...
# (scripts/localnet/up.mjs --participants=3 does this.)
#
# DEV ONLY: the same unsafe HMAC auth as sandbox-auth.conf, with the same env overrides.
canton.participants.participant2 {
  storage.type = memory
  admin-api.port = 6876
  ledger-api.port = 6875
  ledger-api.user-management-service.enabled = true
  ledger-api.auth-services = [{
    type = unsafe-jwt-hmac-256
    secret = "collara-local-dev-secret-change-me"
    secret = ${?CANTON_JWT_HMAC_SECRET}
    target-audience = "https://collara.local/ledger-api"
    target-audience = ${?CANTON_JWT_AUDIENCE}
  }]
  http-ledger-api.port = 7576
}
canton.participants.participant3 {
  storage.type = memory
  admin-api.port = 6886
  ledger-api.port = 6885
  ledger-api.user-management-service.enabled = true
  ledger-api.auth-services = [{
    type = unsafe-jwt-hmac-256
    secret = "collara-local-dev-secret-change-me"
    secret = ${?CANTON_JWT_HMAC_SECRET}
    target-audience = "https://collara.local/ledger-api"
    target-audience = ${?CANTON_JWT_AUDIENCE}
  }]
  http-ledger-api.port = 7577
}
