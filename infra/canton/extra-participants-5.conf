# 5-participant mode (privacy tests): adds participant4 (JSON API 7578) and participant5 (JSON API 7579)
# on top of extra-participants.conf. The sandbox bootstrap connects every local participant to synchronizer-1.
# Load it after the other two files:
#   dpm sandbox -c infra/canton/sandbox-auth.conf -c infra/canton/extra-participants.conf \
#               -c infra/canton/extra-participants-5.conf ...
# (scripts/localnet/up.mjs --participants=5 does this.)
#
# DEV ONLY: the same unsafe HMAC auth as sandbox-auth.conf, with the same env overrides.
canton.participants.participant4 {
  storage.type = memory
  admin-api.port = 6896
  ledger-api.port = 6895
  ledger-api.user-management-service.enabled = true
  ledger-api.auth-services = [{
    type = unsafe-jwt-hmac-256
    secret = "collara-local-dev-secret-change-me"
    secret = ${?CANTON_JWT_HMAC_SECRET}
    target-audience = "https://collara.local/ledger-api"
    target-audience = ${?CANTON_JWT_AUDIENCE}
  }]
  http-ledger-api.port = 7578
}
canton.participants.participant5 {
  storage.type = memory
  admin-api.port = 6906
  ledger-api.port = 6905
  ledger-api.user-management-service.enabled = true
  ledger-api.auth-services = [{
    type = unsafe-jwt-hmac-256
    secret = "collara-local-dev-secret-change-me"
    secret = ${?CANTON_JWT_HMAC_SECRET}
    target-audience = "https://collara.local/ledger-api"
    target-audience = ${?CANTON_JWT_AUDIENCE}
  }]
  http-ledger-api.port = 7579
}
