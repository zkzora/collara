packages:
  - apps/*
  - packages/*

# pnpm 11: every non-auth setting lives here (.npmrc is auth/registry only).
# Setting minimumReleaseAge explicitly makes it strict: pins must be at least 24 h old.
minimumReleaseAge: 1440
catalogMode: strict

allowBuilds:
  esbuild: true
  unrs-resolver: true
  sharp: true

peerDependencyRules:
  allowedVersions:
    # openapi-typescript 7.13.0 declares typescript ^5.x; verified working with TS 6.0.3.
    openapi-typescript>typescript: "6"

# Exact pins. Packages reference these with "catalog:". Sources: ADR-0001 §3 and
# docs/_research/research-webstack.md §3 (all verified on 2026-10-01 with pnpm 11).
catalog:
  # Web core and UI
  next: 16.3.8
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/node": 24.19.0
  typescript: 6.0.3
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  postcss: 8.5.28
  shadcn: 4.21.0
  "@base-ui/react": 1.8.0
  cn: 0.4.0
  class-variance-authority: 0.7.1
  tw-animate-css: 1.4.0
  lucide-react: 1.49.0
  sonner: 2.0.8
  server-only: 0.0.1

  # Client data, forms, utilities
  "@tanstack/react-query": 5.104.0
  "@tanstack/react-query-devtools": 5.104.0
  "@tanstack/react-table": 9.2.4
  react-hook-form: 7.89.0
  "@hookform/resolvers": 5.9.1
  zod: 4.6.5
  date-fns: 4.4.0
  decimal.js: 10.6.0

  # API (Fastify 5)
  fastify: 5.12.5
  fastify-plugin: 6.0.0
  "@fastify/cookie": 11.1.2
  "@fastify/session": 11.1.3
  "@fastify/swagger": 9.9.1
  "@fastify/swagger-ui": 6.1.1
  "@fastify/multipart": 10.1.2
  "@fastify/helmet": 13.1.1
  "@fastify/rate-limit": 11.2.0
  "@fastify/csrf-protection": 8.0.1
  fastify-type-provider-zod: 7.0.0
  openapi-types: 12.1.3
  pino: 10.3.1
  pino-pretty: 13.1.3

  # Data, auth, storage, ledger client
  drizzle-orm: 0.45.3
  drizzle-kit: 0.31.11
  pg: 8.23.1
  "@types/pg": 8.23.1
  "@electric-sql/pglite": 0.5.8
  openid-client: 6.8.8
  jose: 6.2.12
  "@aws-sdk/client-s3": 3.1143.0
  "@aws-sdk/s3-request-presigner": 3.1143.0
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0

  # Tests, lint, tooling
  vitest: 5.0.3
  vite: 8.3.1
  "@vitejs/plugin-react": 6.1.1
  jsdom: 30.1.1
  "@testing-library/react": 16.3.3
  "@testing-library/dom": 10.4.2
  "@testing-library/user-event": 14.6.7
  "@testing-library/jest-dom": 7.0.1
  "@playwright/test": 1.63.0
  "@axe-core/playwright": 4.13.0
  eslint: 9.39.5
  "@eslint/js": 9.39.5
  typescript-eslint: 8.71.0
  eslint-config-next: 16.3.8
  globals: 17.12.0
  tsx: 4.23.15
